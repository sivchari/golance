name: Test

on:
  push:
    branches:
      - main
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
      - name: Run tests
        run: go test -race ./...
  e2e:
    name: E2E tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: 'go.mod'
      # The gopls-parity tests use a real gopls as their oracle and skip
      # cleanly when it is absent; installing the exact version the
      # expectations were written against keeps them running (and honest)
      # in CI.
      - name: Install gopls (parity oracle)
        run: |
          go install golang.org/x/tools/gopls@v0.23.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Run e2e tests
        run: GOLANCE_E2E=1 go test -race -count=1 -run TestE2E -timeout 20m .
